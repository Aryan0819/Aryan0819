name: Update Merged PRs Badge

on:
  schedule:
    - cron: "0 */6 * * *" # Updates every 6 hours
  workflow_dispatch:      # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  update-pr-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch exact Merged PR count (Public + Private)
        env:
          GH_TOKEN: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh api graphql -f query='
            query {
              user(login: "Aryan0819") {
                pullRequests(states: MERGED) {
                  totalCount
                }
              }
            }' --jq '.data.user.pullRequests.totalCount')
          echo "Merged PR count: $COUNT"
          echo "{\"schemaVersion\":1,\"label\":\"Merged Pull Requests\",\"message\":\"$COUNT\",\"color\":\"7aa2f7\",\"namedLogo\":\"github\",\"logoColor\":\"white\",\"style\":\"for-the-badge\"}" > merged-prs.json

      - name: Commit & Push updated count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add merged-prs.json
          git diff --staged --quiet || git commit -m "chore: update merged PR count"
          git push
